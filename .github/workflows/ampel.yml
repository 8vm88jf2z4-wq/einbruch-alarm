name: Risikoampel

on:
  schedule:
    - cron: "25 16,17 * * 0" # sonntags: Wochenausblick, gesendet wird der Lauf um ca. 18:30 Uhr
  workflow_dispatch:         # manueller Start = Testlauf: Wochenausblick + heutiger Stand
# Warnungen bei einem Wechsel auf Rot oder Gelb-Rot prüft der Einbruch-Alarm alle 15 Minuten.

jobs:
  bewerten:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Risiko berechnen
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python3 ampel.py "${{ github.event.schedule }}"
