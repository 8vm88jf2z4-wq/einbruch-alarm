name: Risikoampel

on:
  schedule:
    - cron: "50 5 * * 1"    # montags ca. 6:50 Uhr (Sommerzeit 7:50): Wochenausblick
    - cron: "50 11 * * *"   # täglich ca. 12:50 Uhr (Sommerzeit 13:50): Warnung bei Gelb/Rot
  workflow_dispatch:         # manueller Start = Testlauf, schickt beides

jobs:
  bewerten:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Risiko berechnen
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python3 ampel.py "${{ github.event.schedule }}"
