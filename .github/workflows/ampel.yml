name: Risikoampel

on:
  schedule:
    - cron: "25 16,17 * * 0" # sonntags: Wochenausblick, gesendet wird der Lauf um ca. 18:30 Uhr
    - cron: "50 11 * * *"   # täglich ca. 12:50 Uhr (Sommerzeit 13:50): Warnung bei Gelb/Rot
  workflow_dispatch:         # manueller Start = Testlauf, schickt beides

jobs:
  bewerten:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Risiko berechnen
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python3 ampel.py "${{ github.event.schedule }}"
