name: Einbruch-Alarm

on:
  schedule:
    - cron: "*/15 * * * *"   # alle 15 Minuten
  workflow_dispatch:          # erlaubt den manuellen Start über "Run workflow"

permissions:
  contents: write

concurrency: einbruch-alarm

jobs:
  pruefen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Polizeimeldungen prüfen
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          FORMULAR_CSV: ${{ secrets.FORMULAR_CSV }}
        run: python3 alarm.py

      - name: Ampel-Wechsel prüfen
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python3 ampel.py pruefen

      - name: Status speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || (git commit -m "Status aktualisiert" && git push)
